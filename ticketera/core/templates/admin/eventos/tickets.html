{% extends 'base.html' %}
{% block contenido %}

<h2>Tickets para {{ evento.nombre }}</h2>
<form method="post" class="mb-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Agregar ticket</button>
</form>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Ubicación</th>
            <th>Stock</th>
            <th>Precio</th>
        </tr>
    </thead>
    <tbody>
        {% for t in tickets %}
            <tr>
                <td>{{ t.ubicacion.nombre }}</td>
                <td>${{ t.precio }}</td>
                <td>{{ t.stock }} UNI</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
