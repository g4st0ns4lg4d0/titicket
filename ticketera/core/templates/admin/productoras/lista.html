{% extends 'base.html' %}
{% block contenido %}

<h2>Productoras</h2>
<a href="{% url 'crear_productora' %}" class="btn btn-primary mb-3">Nueva productora</a>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Rut</th>
            <th>Dirección</th>
            <th>Giro</th>
            <th>Teléfono</th>
            <th>E-mail</th>
            <th>Comuna</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for p in productoras %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.rut }}</td>
                <td>{{ p.direccion }}</td>
                <td>{{ p.giro }}</td>
                <td>{{ p.telefono }}</td>
                <td>{{ p.email }}</td>
                <td>{{ p.comuna }}</td>
                <td>
                    <a href="{% url 'editar_productora' p.id %}" class="btn btn-warning btn-sm">Editar</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
