{% extends 'base.html' %}
{% block contenido %}

<h3>Iniciar sesión</h3>
<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label>Usuario:</label>
        <input type="text" name="username" class="form-control">
    </div>
    <div class="mb-3">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-control">
    </div>
    
    <button class="btn btn-primary w-100">Ingresar</button>

</form>

{% endblock %}
